# Corporate Snakes and Ladders on Cloudflare Pages + Functions + D1: free plan only, custom domain https://snakes.corporatetambola.com; the old pages.dev address redirects pages and keeps /api working.
# Deploy with:  bun run pages:deploy   (see README.md in this folder). Secrets are NOT in this file.
name = "corporate-snakes-and-ladders"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]   # billing uses node:crypto HMAC

[[d1_databases]]
binding = "DB"
database_name = "corporate-snakes-and-ladders"
database_id = "3ed0dc2c-c3ab-489c-9e99-71c3644ff30a"

[vars]
DAILY_WRITE_BUDGET = "80000"
PUBLIC_ORIGIN = "https://snakes.corporatetambola.com"
PAY_HOP_URL = "https://itservices-rajat-agarwal.pages.dev/payframe/"   # Option 1: the Razorpay window runs on the website registered with Razorpay
MAIL_FROM = "Corporate Snakes and Ladders <hello@corporatetambola.com>"
OWNER_EMAIL = "hello@corporatetambola.com"
COMPANY_JSON = '{"email":"hello@corporatetambola.com","phone":"(+91) 96503 97480","sacDescription":"Software solutions and products"}'
